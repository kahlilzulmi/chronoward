[package]
name = "tauri-plugin-chronoward-tracking"
version = "0.1.0"
description = "Android UsageStats tracking plugin for Chronoward"
edition = "2021"
links = "tauri-plugin-chronoward-tracking"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
